services:
  postgres:
    image: postgres:16
    container_name: bilisfiber-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: bilisfiber
      POSTGRES_PASSWORD: bilisfiber123
      POSTGRES_DB: bilisfiber

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: